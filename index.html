<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fce4ec" />
  <meta name="description" content="A handmade Mother's Day keepsake — for Amma, with love." />
  <meta property="og:title" content="For Amma — A Mother's Day Keepsake" />
  <meta property="og:description" content="Six little memories. One big love letter." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💐%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Dancing+Script:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />

  <title>For Amma — A Mother's Day Keepsake 💐</title>
</head>
<body>

  <!-- ============ AMBIENT BACKGROUND ============ -->
  <div class="ambient" aria-hidden="true">
    <div class="mesh mesh--1"></div>
    <div class="mesh mesh--2"></div>
    <div class="mesh mesh--3"></div>
    <canvas id="ambient-canvas"></canvas>
  </div>

  <!-- ============ INTRO / WELCOME ============ -->
  <section class="intro" id="intro" aria-label="Welcome">
    <div class="intro__inner">
      <p class="intro__eyebrow">A Mother's Day keepsake</p>
      <h1 class="intro__title">
        <span class="intro__title-line">For my dearest</span>
        <span class="intro__title-name">Amma</span>
      </h1>
      <p class="intro__sub">Six little memories, gathered together for the one who gave me everything.</p>
      <button class="intro__btn" id="beginBtn" type="button">
        <span>Begin</span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ MAIN STAGE ============ -->
  <main class="stage" id="stage" aria-hidden="true">
    <header class="stage__header">
      <p class="stage__eyebrow">A Mother's Day keepsake · for Amma</p>
      <h2 class="stage__title">Catch each memory, one by one</h2>
      <div class="stage__progress" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" id="progressBar">
        <div class="stage__progress-track">
          <div class="stage__progress-fill" id="progressFill"></div>
        </div>
        <div class="stage__progress-label">
          <span id="progressCount">0</span> of 6 memories collected
        </div>
      </div>
    </header>

    <div class="orbs" id="orbs" aria-label="Floating memories"></div>
  </main>

  <!-- ============ FINAL GIFT ============ -->
  <section class="gift-stage" id="giftStage" aria-hidden="true">
    <div class="gift-stage__pedestal">
      <div class="gift-stage__halo"></div>
      <button class="gift" id="giftBtn" type="button" aria-label="Open Amma's gift">
        <div class="gift__lid"></div>
        <div class="gift__box"></div>
        <div class="gift__ribbon-v"></div>
        <div class="gift__ribbon-h"></div>
        <div class="gift__bow">
          <span class="gift__bow-l"></span>
          <span class="gift__bow-r"></span>
          <span class="gift__bow-c"></span>
        </div>
      </button>
      <p class="gift-stage__label">A little something. Just for you.</p>
      <p class="gift-stage__hint">tap the gift, Amma ♡</p>
    </div>
  </section>

  <!-- ============ MEMORY CARD MODAL ============ -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <article class="memory-card" id="memoryCard">
      <div class="memory-card__body" id="memoryBody"></div>
    </article>
  </div>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <span>Handmade with</span>
    <span class="footer__heart" aria-hidden="true">♡</span>
    <span>for Amma</span>
  </footer>

  <!-- ============ AUDIO ============ -->
  <audio id="bgMusic" loop preload="auto" src="https://incompetech.com/music/royalty-free/mp3-royaltyfree/Heartwarming.mp3"></audio>

  <!-- ============ TEMPLATES ============ -->
  <template id="memoryTemplate">
    <figure class="memory-card__photo">
      <img alt="" loading="lazy" />
      <figcaption class="memory-card__caption"></figcaption>
    </figure>
    <h3 class="memory-card__title" id="modalTitle"></h3>
    <p class="memory-card__text"></p>
  </template>

  <template id="finalTemplate">
    <p class="memory-card__eyebrow">a letter for you</p>
    <h3 class="memory-card__title memory-card__title--script" id="modalTitle">Happy Mother's Day, Amma</h3>
    <figure class="memory-card__photo memory-card__photo--final">
      <img alt="Amma" loading="lazy" />
    </figure>
    <p class="memory-card__text memory-card__text--letter"></p>
    <div class="memory-card__hearts" aria-hidden="true">♡ ♡ ♡</div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
